version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hrco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrco
      POSTGRES_PASSWORD: hrco_secret
      POSTGRES_DB: hrco
    ports:
      - "5432:5432"
    volumes:
      - hrco_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrco -d hrco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrco-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "4000"
      DATABASE_DSN: "host=db user=hrco password=hrco_secret dbname=hrco port=5432 sslmode=disable TimeZone=America/Bogota"
      JWT_ACCESS_SECRET: change-me-access-secret-please-use-32-chars-minimum
      JWT_REFRESH_SECRET: change-me-refresh-secret-please-use-32-chars-min
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      AUTO_MIGRATE: "true"
      SEED_ON_BOOT: "true"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: hrco-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  hrco_db_data:
